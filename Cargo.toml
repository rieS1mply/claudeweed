[package]
name = "local-photo"
version = "0.1.0"
edition = "2021"
description = "Personal home cloud: photo/file storage served through a Cloudflare quick tunnel"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
chrono = "0.4"
filetime = "0.2"
flate2 = "1"
futures-util = { version = "0.3", default-features = false }
fs4 = { version = "1", default-features = false, features = ["sync"] }
getrandom = "0.2"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
kamadak-exif = "0.6"
mime_guess = "2"
portable-pty = "0.9"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rpassword = "7"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
zip = { version = "2", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Thumbnails are decoded in debug builds too; keep image decoding fast while developing.
[profile.dev.package.image]
opt-level = 3

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Облако</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login" class="login" hidden>
  <form class="login-form" id="login-form">
    <svg class="login-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a5 5 0 0 1-.6-9.96A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9H7z"/></svg>
    <h1>Облако</h1>
    <div class="inset-group">
      <input name="username" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="Логин" required>
      <input name="password" type="password" autocomplete="current-password" placeholder="Пароль" required>
    </div>
    <!-- Shown once the server asks for it (`local-photo --2fa on`). -->
    <div class="inset-group" id="login-code-box" hidden>
      <input name="code" id="login-code" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" autocomplete="one-time-code" placeholder="Код из приложения" aria-label="Код из приложения">
    </div>
    <div class="login-error" id="login-error" hidden></div>
    <button type="submit" class="btn primary wide" id="login-submit">Войти</button>
  </form>
</div>

<div id="app" hidden>
  <header class="nav" id="nav">
    <div class="brand">Облако <span class="demo-chip" id="demo-chip" hidden>демо</span></div>
    <div class="nav-title" id="nav-title" aria-hidden="true"></div>
    <nav class="seg" id="seg" data-active="photos" role="tablist">
      <span class="thumb" aria-hidden="true"></span>
      <button class="tab active" data-section="photos" role="tab">Фото</button>
      <button class="tab" data-section="files" role="tab">Файлы</button>
      <button class="tab" data-section="notes" role="tab">Заметки</button>
    </nav>
    <div class="actions">
      <button class="btn glass round hide-sm" id="upload-btn" type="button" title="Загрузить">
        <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="btn glass round" id="code-btn" type="button" title="Новый код — написать и запустить" hidden>
        <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14"/></svg>
      </button>
      <a class="btn glass round" id="term-btn" href="terminal.html" title="Терминал" hidden>
        <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>
      </a>
      <button class="btn glass round" id="trash-btn" type="button" title="Корзина">
        <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      </button>
      <button class="btn glass round" id="logout-btn" type="button" title="Выйти">
        <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>
      </button>
    </div>
  </header>

  <div class="page-head">
    <div class="title-row">
      <h1 class="large-title" id="page-title">Фото</h1>
      <div class="head-buttons">
        <button class="btn link" id="head-action" type="button" hidden></button>
        <button class="btn pill" id="select-btn" type="button">Выбрать</button>
      </div>
    </div>
    <div class="summary" id="summary"></div>
    <label class="search" id="search-box">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="search" type="search" placeholder="Поиск" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Поиск по имени">
      <kbd class="search-key" aria-hidden="true">/</kbd>
    </label>
  </div>
  <main id="content" class="content"></main>

  <!-- Phone: floating tab bar + separate round action, like iOS 26. -->
  <div class="dock">
    <nav class="tabbar glass" id="tabbar" data-active="photos" role="tablist">
      <span class="thumb" aria-hidden="true"></span>
      <button class="tab active" data-section="photos" role="tab">
        <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
        <span>Фото</span>
      </button>
      <button class="tab" data-section="files" role="tab">
        <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>Файлы</span>
      </button>
      <button class="tab" data-section="notes" role="tab">
        <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg>
        <span>Заметки</span>
      </button>
    </nav>
    <button class="fab glass" id="upload-fab" type="button" title="Загрузить">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- Actions for the selected items -->
  <div class="selbar glass" id="selbar" hidden>
    <button class="sel-btn" id="sel-share" hidden>
      <svg viewBox="0 0 24 24" class="icon"><path d="M12 15V3m0 0L8 7m4-4 4 4"/><path d="M8 10H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-2"/></svg>
      <span>В галерею</span>
    </button>
    <button class="sel-btn" id="sel-download">
      <svg viewBox="0 0 24 24" class="icon"><path d="M12 4v12m0 0-5-5m5 5 5-5M4 20h16"/></svg>
      <span>Скачать</span>
    </button>
    <button class="sel-btn danger" id="sel-delete">
      <svg viewBox="0 0 24 24" class="icon"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      <span>Удалить</span>
    </button>
  </div>

  <input type="file" id="file-input" multiple hidden>
</div>

<div id="lightbox" class="lightbox" hidden>
  <div class="lb-bg" id="lb-bg"></div>
  <div class="lb-stage" id="lb-stage">
    <div class="lb-frame" id="lb-frame">
      <img id="lb-img" alt="" draggable="false" hidden>
      <video id="lb-video" controls playsinline hidden></video>
      <div class="lb-fallback" id="lb-fallback" hidden>Этот формат браузер показать не может — скачайте файл.</div>
    </div>
  </div>
  <div class="lb-chrome">
    <div class="lb-bar">
      <div class="lb-info glass">
        <div class="lb-title" id="lb-title"></div>
        <div class="lb-meta" id="lb-meta"></div>
      </div>
      <div class="lb-actions glass">
        <button class="btn round" id="lb-share" title="Сохранить в галерею" hidden>
          <svg viewBox="0 0 24 24" class="icon"><path d="M12 15V3m0 0L8 7m4-4 4 4"/><path d="M8 10H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-2"/></svg>
        </button>
        <button class="btn round" id="lb-edit" title="Редактировать">
          <svg viewBox="0 0 24 24" class="icon"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        </button>
        <button class="btn round" id="lb-delete" title="Удалить">
          <svg viewBox="0 0 24 24" class="icon"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        </button>
        <button class="btn round" id="lb-more" title="Ещё">
          <svg viewBox="0 0 24 24" class="icon"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
        </button>
        <button class="btn round" id="lb-close" title="Закрыть">
          <svg viewBox="0 0 24 24" class="icon"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <button class="lb-nav prev glass" id="lb-prev" title="Назад"><svg viewBox="0 0 24 24" class="icon"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="lb-nav next glass" id="lb-next" title="Вперёд"><svg viewBox="0 0 24 24" class="icon"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<div id="uploads" class="uploads glass" hidden>
  <div class="uploads-head">
    <span id="uploads-title">Загрузка</span>
    <button class="btn round small" id="uploads-close" title="Скрыть">
      <svg viewBox="0 0 24 24" class="icon"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="uploads-list" id="uploads-list"></div>
</div>

<div id="modal" class="modal" hidden>
  <div class="alert glass" id="alert">
    <div class="alert-title" id="alert-title">Удалить?</div>
    <div class="alert-text" id="modal-text"></div>
    <div class="alert-actions">
      <button id="modal-cancel">Отмена</button>
      <button id="modal-ok" class="destructive">Удалить</button>
    </div>
  </div>
</div>

<div id="prompt" class="modal" hidden>
  <div class="alert glass" id="prompt-box">
    <div class="alert-title" id="prompt-title"></div>
    <div class="alert-field"><input id="prompt-input" autocomplete="off" spellcheck="false"></div>
    <div class="alert-actions">
      <button id="prompt-cancel">Отмена</button>
      <button id="prompt-ok" class="strong">Готово</button>
    </div>
  </div>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-wrap">
    <div class="sheet-panel glass" id="sheet-panel">
      <div class="sheet-title" id="sheet-title"></div>
      <div class="sheet-actions" id="sheet-actions"></div>
    </div>
    <button class="sheet-cancel glass" id="sheet-cancel">Отмена</button>
  </div>
</div>

<!-- Photo editor -->
<div id="editor" class="editor" hidden>
  <div class="ed-bar">
    <button class="doc-btn" id="ed-cancel">Отмена</button>
    <div class="ed-title" id="ed-title"></div>
    <button class="doc-btn strong" id="ed-done">Готово</button>
  </div>
  <div class="ed-stage" id="ed-stage">
    <canvas id="ed-canvas"></canvas>
    <div class="ed-crop" id="ed-crop" hidden>
      <span class="h nw" data-h="nw"></span><span class="h ne" data-h="ne"></span>
      <span class="h sw" data-h="sw"></span><span class="h se" data-h="se"></span>
    </div>
  </div>
  <div class="ed-tools">
    <div id="ed-adjust-tools">
      <div class="chips" id="ed-chips"></div>
      <input type="range" id="ed-slider" class="slider" min="-100" max="100" value="0">
    </div>
    <div id="ed-crop-tools" hidden>
      <div class="chips" id="ed-aspects"></div>
      <div class="ed-crop-actions">
        <button class="btn round glass" id="ed-rotate" title="Повернуть">
          <svg viewBox="0 0 24 24" class="icon"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="btn round glass" id="ed-flip" title="Отразить">
          <svg viewBox="0 0 24 24" class="icon"><path d="M12 3v18M8 7 3 12l5 5V7zM16 7l5 5-5 5V7z"/></svg>
        </button>
      </div>
    </div>
    <div class="ed-bottom">
      <button class="btn link small-text" id="ed-reset">Сбросить</button>
      <nav class="seg static" id="ed-mode" data-active="adjust">
        <span class="thumb" aria-hidden="true"></span>
        <button class="tab active" data-mode="adjust">Коррекция</button>
        <button class="tab" data-mode="crop">Обрезка</button>
      </nav>
      <span class="ed-spacer"></span>
    </div>
  </div>
</div>

<!-- Text editor and notes -->
<div id="doc" class="doc" hidden>
  <div class="doc-bar">
    <button class="doc-btn" id="doc-left"></button>
    <div class="doc-mid">
      <div class="doc-title" id="doc-title"></div>
      <div class="doc-status" id="doc-status"></div>
    </div>
    <div class="doc-right" id="doc-right"></div>
  </div>
  <!-- Code files only: language, cursor position, wrapping, font size, go to line. -->
  <div class="code-bar" id="code-bar" hidden>
    <button class="code-run" id="code-run" type="button" title="Запустить (Ctrl+Enter)" hidden>
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg><span>Запустить</span>
    </button>
    <span class="code-lang" id="code-lang"></span>
    <span class="code-pos" id="code-pos"></span>
    <span class="ed-spacer"></span>
    <button class="code-tool touch-only" id="code-tab" type="button" title="Отступ">⇥</button>
    <button class="code-tool" id="code-goto" type="button" title="Перейти к строке (Ctrl+G)">Строка</button>
    <button class="code-tool" id="code-wrap" type="button" title="Перенос строк (Alt+Z)">Перенос</button>
    <button class="code-tool" id="code-smaller" type="button" title="Мельче (Ctrl+−)">A−</button>
    <button class="code-tool" id="code-bigger" type="button" title="Крупнее (Ctrl+=)">A+</button>
  </div>
  <div class="doc-body" id="doc-body">
    <!-- A highlighted copy of the text under a transparent textarea: native typing, selection and undo. -->
    <div class="code-gutter" id="code-gutter" aria-hidden="true" hidden></div>
    <pre class="code-hl" id="code-hl" aria-hidden="true" hidden></pre>
    <textarea id="doc-text" spellcheck="true"></textarea>
  </div>
  <!-- Output of a run. Drag the top edge (desktop) or tap the header (phone) to resize. -->
  <section class="run-panel" id="run-panel" hidden>
    <div class="run-grip" id="run-grip" aria-hidden="true"></div>
    <div class="run-head" id="run-head">
      <span class="run-dot" id="run-dot" data-state="idle"></span>
      <span class="run-status" id="run-status"></span>
      <span class="ed-spacer"></span>
      <button class="code-tool" id="run-stdin-btn" type="button" title="Что программа прочитает из стандартного ввода">Ввод</button>
      <button class="code-tool" id="run-clear" type="button" title="Очистить вывод">Очистить</button>
      <button class="code-tool" id="run-expand" type="button" title="Развернуть">⤢</button>
      <button class="code-tool" id="run-close" type="button" title="Скрыть вывод">✕</button>
    </div>
    <textarea class="run-stdin" id="run-stdin" placeholder="Ввод для программы (stdin): каждая строка — одна строка ввода" spellcheck="false" autocapitalize="off" autocorrect="off" hidden></textarea>
    <pre class="run-out" id="run-out"></pre>
  </section>
  <!-- Phone: symbols a phone keyboard hides two screens deep. -->
  <div class="sym-bar" id="sym-bar" hidden></div>
</div>

<div id="drop" class="drop" hidden><div class="drop-card glass">Отпустите, чтобы загрузить</div></div>
<div id="toast" class="toast glass" hidden></div>

<script src="app.js"></script>
<script src="editor.js"></script>
<script src="runner.js"></script>
<script src="notes.js"></script>
<script src="trash.js"></script>
<script src="select.js"></script>
<script src="start.js"></script>
</body>
</html>

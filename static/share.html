<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>Облако</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/share.css">
</head>
<body>
<!-- Opened by a link without the password: only what the link names, only until it expires. -->
<main class="share">
  <header class="share-head">
    <div class="brand">Облако</div>
    <h1 class="large-title" id="share-title"></h1>
    <div class="summary" id="share-meta"></div>
  </header>
  <div id="share-content"><div class="loading"></div></div>
</main>
<div class="share-view" id="share-view" hidden>
  <button class="btn glass round share-close" id="share-close" title="Закрыть">
    <svg viewBox="0 0 24 24" class="icon"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <div class="share-stage" id="share-stage"></div>
  <a class="btn glass share-dl" id="share-dl">Скачать</a>
</div>
<script src="/i18n.js"></script>
<script src="/lang-en.js"></script>
<script src="/share.js"></script>
</body>
</html>

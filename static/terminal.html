<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Терминал</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="xterm.css">
<link rel="stylesheet" href="terminal.css">
</head>
<body class="term-page">

<header class="term-bar">
  <a class="btn glass round" href="/" title="Облако">
    <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <div class="term-title">
    <span class="term-dot" id="term-dot" data-state="connecting"></span>
    <span class="term-name" id="term-name">Терминал</span>
    <span class="term-traffic" id="term-traffic"></span>
  </div>
  <div class="term-tools">
    <button class="btn glass round" id="term-help" type="button" title="Шпаргалка команд">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17.2v.1"/></svg>
    </button>
    <button class="btn glass round" id="term-smaller" type="button" title="Мельче">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M6 12h12"/></svg>
    </button>
    <button class="btn glass round" id="term-bigger" type="button" title="Крупнее">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>
    </button>
    <button class="btn glass round term-wide" id="term-layout" type="button" title="Окна: 1 / 2 / 4">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
    </button>
    <button class="btn glass round" id="term-restart" type="button" title="Перезапустить оболочку в этом окне">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>
</header>

<!-- Sessions; double-click (long press on a phone) renames. -->
<nav class="term-tabs" id="term-tabs" aria-label="Сеансы">
  <button class="term-new" id="term-new" type="button" title="Новый сеанс">+</button>
</nav>

<main class="term-wrap" id="term-wrap" data-layout="1"></main>

<div class="term-overlay" id="term-overlay" hidden>
  <div class="term-msg glass">
    <div class="term-msg-text"></div>
    <div class="term-msg-actions"></div>
  </div>
</div>

<!-- Keys a phone keyboard doesn't have; they go to the active window. -->
<nav class="term-keys" id="term-keys" aria-label="Клавиши">
  <button data-key="esc">Esc</button>
  <button data-key="tab">Tab</button>
  <button data-key="ctrl" class="latch" id="key-ctrl">Ctrl</button>
  <button data-key="^c">^C</button>
  <button data-key="left">←</button>
  <button data-key="up">↑</button>
  <button data-key="down">↓</button>
  <button data-key="right">→</button>
  <button data-key="|">|</button>
  <button data-key="~">~</button>
  <button data-key="/">/</button>
  <button data-key="-">-</button>
</nav>

<!-- Cheat sheet: the same list as `cmds` in the shell (commands.json). -->
<div class="cheat" id="cheat" hidden>
  <div class="cheat-box glass" role="dialog" aria-label="Шпаргалка команд">
    <div class="cheat-head">
      <input id="cheat-q" type="search" placeholder="Поиск: git, удалить, папка…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn glass round" id="cheat-close" type="button" title="Закрыть">
        <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="cheat-list" id="cheat-list"></div>
    <p class="cheat-hint">Нажмите на команду — она появится в терминале. В самом терминале то же: cmds</p>
  </div>
</div>

<template id="pane-tpl">
  <section class="term-pane">
    <div class="term"></div>
    <div class="term-overlay" hidden>
      <div class="term-msg glass">
        <div class="term-msg-text"></div>
        <div class="term-msg-actions"></div>
      </div>
    </div>
  </section>
</template>

<script src="xterm.js"></script>
<script src="xterm-addon-fit.js"></script>
<script src="i18n.js"></script>
<script src="lang-en.js"></script>
<script src="terminal.js"></script>
</body>
</html>
